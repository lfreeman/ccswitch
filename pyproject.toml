[project]
name = "ccswitch"
version = "0.1.0"
description = "macOS account switcher for Claude Code"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[project.scripts]
ccswitch = "ccswitch.cli:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccswitch"]
